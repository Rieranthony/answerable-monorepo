# Cloudflare's stand-in for the kind stack, applied in the platform namespace before charts/platform, whose
# platform-edge.yaml puts the nginx beside Traefik. The test writes its two Secrets first, from certificates it makes with
# openssl (infra/k8s/local/stack.ts):
#
# - edge-origin-pull: the client certificate the edge presents, as Cloudflare does, from the stand-in for Cloudflare's
#   origin-pull CA, which the test passes to charts/platform as originPull.caPem; the test presents it too.
# - edge-tls: the edge's server certificate for the public names and ca.crt, the stack's CA, which also signed origin-tls,
#   the certificate Traefik serves.
#
# Here: the edge's nginx configuration, and a Service at a fixed address, which the pods' /etc/hosts gives for the public
# names (values-local.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge
  namespace: platform
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 256;
    }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 48444 ssl;
        server_name id.127-0-0-1.sslip.io toolbox.127-0-0-1.sslip.io admin-mcp.127-0-0-1.sslip.io;
        ssl_certificate /edge/tls/tls.crt;
        ssl_certificate_key /edge/tls/tls.key;
        location / {
          # Traefik's websecure entry point listens in the same pod: it sees this hop as 127.0.0.1, which it and ID
          # trust in the stack.
          proxy_pass https://127.0.0.1:8443;
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name $host;
          proxy_ssl_certificate /edge/client/tls.crt;
          proxy_ssl_certificate_key /edge/client/tls.key;
          proxy_ssl_trusted_certificate /edge/tls/ca.crt;
          proxy_ssl_verify on;
          proxy_set_header Host $http_host;
          # As Cloudflare does: keep what the caller sent and append the caller's address.
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_buffering off;
          proxy_read_timeout 300s;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: platform
spec:
  # A fixed address in kind's service range (kind.yaml), so that values-local.yaml can name it in the pods' /etc/hosts.
  clusterIP: 10.96.48.43
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: platform-platform
  ports:
    - name: https
      port: 48443
      targetPort: 48444
