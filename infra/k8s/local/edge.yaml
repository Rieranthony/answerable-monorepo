# Cloudflare's stand-in for the kind stack, applied in the platform namespace after charts/platform and before
# platform-edge.yaml puts the nginx beside ingress-nginx's controller.
#
# - origin-pull-ca: the certificate authority whose ca.crt the ingress verifies client certificates against, as the one
#   Answerable uploads to Cloudflare does (D19). The test copies it to answerable/cloudflare-origin-pull-ca.
# - edge-origin-pull: the client certificate the edge presents, as Cloudflare does; the test presents it too.
# - edge-tls: the edge's server certificate for the public names, from the stack's CA (charts/platform's local issuer).
# - edge: a Service at a fixed address, which the pods' /etc/hosts gives for the public names (values-local.yaml).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: origin-pull-root
  namespace: platform
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: origin-pull-ca
  namespace: platform
spec:
  isCA: true
  commonName: Answerable local origin-pull CA
  secretName: origin-pull-ca
  duration: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: origin-pull-root
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: origin-pull
  namespace: platform
spec:
  ca:
    secretName: origin-pull-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-origin-pull
  namespace: platform
spec:
  secretName: edge-origin-pull
  commonName: origin-pull.local
  usages: [client auth, digital signature]
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: origin-pull
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: platform
spec:
  secretName: edge-tls
  dnsNames:
    - id.127-0-0-1.sslip.io
    - toolbox.127-0-0-1.sslip.io
    - admin-mcp.127-0-0-1.sslip.io
  usages: [server auth, digital signature]
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge
  namespace: platform
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {
      worker_connections 256;
    }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 48444 ssl;
        server_name id.127-0-0-1.sslip.io toolbox.127-0-0-1.sslip.io admin-mcp.127-0-0-1.sslip.io;
        ssl_certificate /edge/tls/tls.crt;
        ssl_certificate_key /edge/tls/tls.key;
        location / {
          # The controller listens in the same pod: it sees this hop as 127.0.0.1, which ID trusts in the stack.
          proxy_pass https://127.0.0.1:443;
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_ssl_name $host;
          proxy_ssl_certificate /edge/client/tls.crt;
          proxy_ssl_certificate_key /edge/client/tls.key;
          proxy_ssl_trusted_certificate /edge/tls/ca.crt;
          proxy_ssl_verify on;
          proxy_set_header Host $http_host;
          # As Cloudflare does: keep what the caller sent and append the caller's address.
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_buffering off;
          proxy_read_timeout 300s;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: platform
spec:
  # A fixed address in kind's service range (kind.yaml), so that values-local.yaml can name it in the pods' /etc/hosts.
  clusterIP: 10.96.48.43
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: platform
    app.kubernetes.io/component: controller
  ports:
    - name: https
      port: 48443
      targetPort: 48444
