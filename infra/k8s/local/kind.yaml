# The local cluster for bun run infra:test. One node; ingress-nginx binds the two host ports on it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: answerable-local
networking:
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 48443
        hostPort: 48443
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 48080
        hostPort: 48080
        listenAddress: 127.0.0.1
        protocol: TCP
