# The kind stack's PostgreSQL 17, standing in for the managed database: TLS only (plain connections are refused by
# pg_hba), a server certificate from a certificate authority of its own, and, as a managed database starts, one
# administrative login that may create databases and roles but is not a superuser. The ops bootstrap Job fetches that
# authority into the postgres-ca ConfigMap, which the services trust and nothing else, and creates the databases and their
# logins with the login. The test creates two Secrets first (infra/k8s/local/stack.ts): postgres-tls, the server's key and
# its certificate followed by the authority's, made with openssl; and postgres-bootstrap, the superuser's password and
# admin.sql, which runs once when the data directory is created, with throwaway passwords.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: database
data:
  pg_hba.conf: |
    # The init script connects over the socket; everything else must use TLS.
    local     all  all                trust
    hostssl   all  all  0.0.0.0/0     scram-sha-256
    hostssl   all  all  ::/0          scram-sha-256
    hostnossl all  all  0.0.0.0/0     reject
    hostnossl all  all  ::/0          reject
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/config/pg_hba.conf
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-bootstrap
                  key: SUPERUSER_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # Postgres accepts a key owned by root only when no more than its group can read it: 0440, the group being fsGroup 70.
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0440
        - name: config
          configMap:
            name: postgres
            items:
              - { key: pg_hba.conf, path: pg_hba.conf }
        - name: init
          secret:
            secretName: postgres-bootstrap
            defaultMode: 0440
            items:
              - { key: admin.sql, path: admin.sql }
