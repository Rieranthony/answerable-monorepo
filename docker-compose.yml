# Local environment. `bun dev` starts this before the apps.
name: answerable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: answerable
      POSTGRES_PASSWORD: answerable
      POSTGRES_DB: answerable_id
    ports:
      - "47432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answerable -d answerable_id"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "47379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
