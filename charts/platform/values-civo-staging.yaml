# Staging on Civo. Terraform applies this file (platform_values_files in infra/civo/envs/staging/terraform.tfvars:
# "../../../../charts/platform/values-civo-staging.yaml") and then its own values: the load balancer's firewall and
# address, the addresses Traefik trusts for forwarded headers, and originPull.caPem: the origin-pull CA from
# infra/civo/envs/staging/edge-ca/ca.pem (bun run setup origin-pull --environment staging).

# Without Cloudflare's origin-pull CA Traefik would refuse every connection, so an empty caPem fails the render.
originPull:
  caRequired: true

# The Issuer letsencrypt in namespace answerable, reading the Secret cloudflare-api-token (key api-token) there, which
# the deploy applies from infra/civo/envs/staging/secrets.enc.yaml.
issuers:
  letsencrypt:
    enabled: true

cert-manager:
  # Check the challenge records against public resolvers, not the cluster's.
  extraArgs:
    - --dns01-recursive-nameservers-only
    - --dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53

k8s-monitoring:
  cluster:
    name: answerable-staging
