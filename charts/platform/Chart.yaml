apiVersion: v2
name: platform
description: "The cluster's edge for Answerable: Traefik and the TLS option that demands Cloudflare's origin-pull certificate. Installed once per cluster by Terraform (release platform, namespace platform)."
type: application
version: 0.3.0
kubeVersion: ">=1.29.0-0"
dependencies:
  # Traefik v3.7.14 (D31), in place of the retired ingress-nginx. Terraform's values address the dependency by this
  # name: traefik.service.annotations and traefik.ports.websecure.forwardedHeaders.trustedIPs. It is an OCI chart, so
  # `helm dependency build` needs no repository added.
  - name: traefik
    version: 41.7.1
    repository: oci://ghcr.io/traefik/helm
