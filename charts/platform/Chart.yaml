apiVersion: v2
name: platform
description: "The cluster's shared controllers for Answerable: Traefik and the origin-pull TLS options, cert-manager and its issuers, and the Grafana agent. Installed once per cluster by Terraform (release platform, namespace platform)."
type: application
version: 0.2.0
kubeVersion: ">=1.29.0-0"
dependencies:
  # Traefik v3.7.14 (D31), in place of the retired ingress-nginx. Terraform's values address the dependency by this
  # name: traefik.service.annotations and traefik.ports.websecure.forwardedHeaders.trustedIPs. Every dependency is an
  # OCI chart, so `helm dependency build` needs no repository added.
  - name: traefik
    version: 41.7.1
    repository: oci://ghcr.io/traefik/helm
  - name: cert-manager
    version: v1.21.2
    repository: oci://quay.io/jetstack/charts
  - name: k8s-monitoring
    version: 4.5.3
    repository: oci://ghcr.io/grafana/helm-charts
    condition: monitoring.enabled
