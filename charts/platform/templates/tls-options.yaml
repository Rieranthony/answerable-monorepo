{{- /*
Only Cloudflare reaches the services (D18, D19): every TLS connection to Traefik must present a client certificate
signed by the origin-pull CA. default is the option Traefik applies to every router that names none, which every
Ingress of the answerable chart is; only the answerable namespace may define it (defaultTLSResourcesNamespace), and a
router that named a conflicting option would be refused (strictTLSOptions). It refuses a connection whose server name
matches no certificate. The CA Secret is beside it (origin-pull-ca.yaml); Traefik's CRDs come from its chart's crds/
directory, which Helm installs before this.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: {{ .Values.originPull.namespace }}
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  minVersion: VersionTLS12
  sniStrict: true
  clientAuth:
    secretNames:
      - {{ .Values.originPull.caSecret }}
    clientAuthType: RequireAndVerifyClientCert
