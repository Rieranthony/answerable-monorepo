{{- /*
Cloudflare's origin-pull CA, which the TLS option verifies every client certificate against (tls-options.yaml), as the
Secret it names, in its namespace. Its certificate is public: it comes from originPull.caPem, which Terraform's platform
module passes from the edge module's origin-pull CA, so nothing else creates the Secret. Without it Traefik refuses every
connection; the Civo overlays make an empty value fail the render instead.
*/ -}}
{{- with .Values.originPull }}
{{- if .caPem }}
{{- if not (and (contains "-----BEGIN CERTIFICATE-----" .caPem) (contains "-----END CERTIFICATE-----" .caPem)) }}
{{- fail "originPull.caPem must be a PEM certificate (-----BEGIN CERTIFICATE----- … -----END CERTIFICATE-----): the origin-pull CA Terraform's edge module makes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .caSecret }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: platform
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
data:
  ca.crt: {{ .caPem | b64enc }}
{{- else if .caRequired }}
{{- fail "originPull.caPem is empty: Traefik would refuse every connection without Cloudflare's origin-pull CA. Terraform's platform module passes it from the edge module's origin-pull CA" }}
{{- end }}
{{- end }}
