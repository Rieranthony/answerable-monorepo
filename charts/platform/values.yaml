# Defaults for every cluster. The overlays (values-civo-<environment>.yaml, values-local.yaml) add what differs, and
# Terraform adds, last, what only it knows: the load balancer's firewall and address, and the ranges ingress-nginx trusts
# (infra/civo/modules/platform). The chart creates no namespace: Terraform does.

ingress-nginx:
  controller:
    replicaCount: 2
    ingressClassResource:
      name: nginx
      enabled: true
      default: false
    ingressClass: nginx
    # Terraform merges proxy-real-ip-cidr into this map: the addresses whose X-Forwarded-For ingress-nginx believes
    # (Cloudflare's ranges and the load balancer's network). ingress-nginx appends the connecting address rather than
    # replacing the header, so ID walks the whole chain itself against TRUSTED_PROXY_CIDRS (D22).
    config:
      use-forwarded-headers: "true"
      compute-full-forwarded-for: "true"
      server-tokens: "false"
      ssl-protocols: "TLSv1.2 TLSv1.3"
      # HSTS is Cloudflare's, at the edge (D18).
      hsts: "false"
    service:
      type: LoadBalancer
      annotations: {}
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
    metrics:
      enabled: false
  defaultBackend:
    enabled: false

cert-manager:
  crds:
    enabled: true
    # Uninstalling the release must not delete every Certificate in the cluster with the definitions.
    keep: true
  global:
    leaderElection:
      namespace: platform
  prometheus:
    enabled: false

# The ClusterIssuers the answerable chart's Ingresses name (ingress.clusterIssuer there).
issuers:
  # Let's Encrypt through a DNS-01 challenge in the environment's Cloudflare zone. The token is the Secret
  # cloudflare-api-token (key api-token) in this namespace, applied by the deploy from the sops file.
  letsencrypt:
    enabled: false
    # Optional ACME account address; Let's Encrypt no longer mails expiry notices, so none is needed.
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
  # A self-signed certificate authority for the kind stack: its certificate is the Secret local-ca in this namespace.
  local:
    enabled: false

# The Grafana agent (k8s-monitoring): off until the Grafana Cloud workspace exists. Its endpoints' credentials are the
# Secret grafana-cloud in this namespace (keys metrics-username, logs-username and token), applied by the deploy.
monitoring:
  enabled: false

k8s-monitoring:
  cluster:
    name: answerable
  destinations:
    grafana-cloud-metrics:
      type: prometheus
      url: ""
      auth:
        type: basic
        usernameKey: metrics-username
        passwordKey: token
      secret:
        create: false
        name: grafana-cloud
        namespace: platform
    grafana-cloud-logs:
      type: loki
      url: ""
      auth:
        type: basic
        usernameKey: logs-username
        passwordKey: token
      secret:
        create: false
        name: grafana-cloud
        namespace: platform
  clusterMetrics:
    enabled: true
  clusterEvents:
    enabled: true
  # Pod logs through the Kubernetes API, which needs no hostPath on the nodes.
  podLogsViaKubernetesApi:
    enabled: true
