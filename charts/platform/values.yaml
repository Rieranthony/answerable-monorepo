# Defaults for every cluster. The overlays (values-civo-<environment>.yaml, values-local.yaml) add what differs, and
# Terraform adds, last, what only it knows: the load balancer's firewall and address, the addresses Traefik trusts for
# forwarded headers, and Cloudflare's origin-pull CA (infra/civo/modules/platform). The chart creates no namespace:
# Terraform does.

# The edge in the cluster (D31): Traefik terminates TLS with the certificate in the Secret origin-tls, which every Ingress
# of the answerable chart names (Cloudflare's Origin CA, written by Terraform), requires Cloudflare's origin-pull client
# certificate on every host (templates/tls-options.yaml), and passes X-Forwarded-For on.
traefik:
  deployment:
    replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  ingressClass:
    enabled: true
    isDefaultClass: false
    name: traefik
  # Refuse a router whose TLS options conflict, rather than fall back to the default ones (GHSA-g55h-rg46-x9c5).
  core:
    strictTLSOptions: true
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: false
      # Only the answerable namespace may define the cluster-wide default TLS option, and it does.
      defaultTLSResourcesNamespace: answerable
    kubernetesIngress:
      enabled: true
  ports:
    # Plain HTTP is Cloudflare's to redirect (D18): the load balancer gets no port 80, and anything that reaches the
    # entry point inside the cluster is redirected.
    web:
      expose:
        default: false
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      # Terraform sets trustedIPs: the addresses that may connect to Traefik with X-Forwarded-* headers it keeps
      # (Cloudflare's ranges and the load balancer's private network). From any other peer Traefik deletes them. Either
      # way it appends the peer's address, which ID's walk against TRUSTED_PROXY_CIDRS needs: never set
      # notAppendXForwardedFor to true.
      forwardedHeaders:
        trustedIPs: []
        insecure: false
        notAppendXForwardedFor: false
  service:
    annotations: {}
    spec:
      type: LoadBalancer
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# Where the origin-pull TLS option lives, beside the Secret caSecret (key ca.crt) that holds Cloudflare's origin-pull CA
# and that this release renders from caPem (templates/origin-pull-ca.yaml).
originPull:
  namespace: answerable
  caSecret: cloudflare-origin-pull-ca
  # The origin-pull CA's certificate, PEM. Terraform passes the edge module's; the kind stack passes its stand-in's.
  # Empty renders no Secret, so Traefik refuses every client certificate.
  caPem: ""
  # Whether an empty caPem fails the render. The Civo overlays turn it on.
  caRequired: false
