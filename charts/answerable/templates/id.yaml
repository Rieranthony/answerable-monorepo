{{- /* Answerable ID: the bundle, as a restricted runtime login. Configuration: docs/06-deploying-answerable-id.md. */ -}}
{{- define "answerable.idEnv" -}}
- name: BETTER_AUTH_URL
  value: {{ include "answerable.idUrl" . | quote }}
- name: BETTER_AUTH_TRUSTED_ORIGINS
  value: {{ join "," .Values.id.trustedOrigins | quote }}
# The hops whose X-Forwarded-For entries ID skips, which Terraform writes from Cloudflare's live list.
- name: TRUSTED_PROXY_CIDRS
  valueFrom:
    configMapKeyRef:
      name: {{ .Values.trustedProxies.configMap }}
      key: cidrs
- name: PLATFORM_ORGANIZATION_SLUG
  value: {{ .Values.id.platformOrganization.slug | quote }}
- name: PLATFORM_ORGANIZATION_NAME
  value: {{ .Values.id.platformOrganization.name | quote }}
{{ include "answerable.secretEnv" (dict "name" "DATABASE_URL" "secret" "id-database" "key" "DATABASE_URL") }}
{{- end -}}
{{- /*
id-env holds ID's own secrets, by their variable names: BETTER_AUTH_SECRET, ROOT_ADMIN_SECRET and the
platform applications' client IDs and secrets, which the deploy writes from the GitHub environment. idEnvChecksum, the
deploy's SHA-256 of them, rolls ID's pods when one changes, as a new tag of the same commit would not.
*/ -}}
{{- $envFrom := "- secretRef:\n    name: id-env" -}}
{{ include "answerable.server" (dict
  "root" .
  "component" "id"
  "image" "id"
  "port" 47300
  "values" .Values.id
  "host" .Values.hostnames.id
  "env" (include "answerable.idEnv" .)
  "envFrom" $envFrom
  "podAnnotations" (dict "checksum/id-env" (.Values.idEnvChecksum | toString))
  "readiness" "/readyz"
  "liveness" "/healthz") }}
