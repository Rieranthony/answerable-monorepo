{{- /*
Nothing moves in this namespace unless a policy below allows it. The servers take connections only from Traefik; every pod
may resolve names; the servers and the Jobs reach the database; the servers and the ops Jobs reach HTTPS
outside the private ranges (ID through Cloudflare, the identity providers); the ops Jobs reach the Kubernetes API; ID
reaches what id.extraEgress adds, such as a company directory on a private network. The ops policy exists whenever an ops
image is named, not only in a run that switches a Job on: the Jobs are hooks, which run before the release's own
resources are applied, so a policy rendered only with them would not exist yet when bootstrap runs.
*/ -}}
{{- $np := .Values.networkPolicy -}}
{{- define "answerable.egressDns" -}}
- to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ports:
    - { port: 53, protocol: UDP }
    - { port: 53, protocol: TCP }
{{- end -}}
{{- define "answerable.egressDatabase" -}}
{{- with .Values.networkPolicy.database }}
- to:
    {{- toYaml . | nindent 4 }}
  ports:
    - { port: {{ $.Values.networkPolicy.databasePort }}, protocol: TCP }
{{- end }}
{{- end -}}
{{- define "answerable.egressHttps" -}}
{{- with .Values.networkPolicy.https }}
- to:
    {{- toYaml . | nindent 4 }}
  ports:
    {{- range $.Values.networkPolicy.httpsPorts }}
    - { port: {{ . }}, protocol: TCP }
    {{- end }}
{{- end }}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "answerable.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- range $server := list (dict "component" "id" "port" 47300) (dict "component" "toolbox" "port" 47400) (dict "component" "admin-mcp" "port" 47520) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $server.component }}
  labels:
    {{- include "answerable.labels" (dict "root" $ "component" $server.component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "answerable.selectorLabels" (dict "root" $ "component" $server.component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.ingressController.podLabels | nindent 14 }}
      ports:
        - { port: {{ $server.port }}, protocol: TCP }
  egress:
    {{- include "answerable.egressDns" $ | nindent 4 }}
    {{- include "answerable.egressDatabase" $ | nindent 4 }}
    {{- include "answerable.egressHttps" $ | nindent 4 }}
    {{- if eq $server.component "id" }}
    {{- with $.Values.id.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  labels:
    {{- include "answerable.labels" (dict "root" . "component" "migrate") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "answerable.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "answerable.egressDns" . | nindent 4 }}
    {{- include "answerable.egressDatabase" . | nindent 4 }}
{{- if .Values.images.ops.repository }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops
  labels:
    {{- include "answerable.labels" (dict "root" . "component" "ops") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "answerable.selectorLabels" (dict "root" . "component" "ops") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "answerable.egressDns" . | nindent 4 }}
    {{- include "answerable.egressDatabase" . | nindent 4 }}
    {{- include "answerable.egressHttps" . | nindent 4 }}
    {{- with $np.kubernetesApi }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $np.kubernetesApiPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
{{- end }}
