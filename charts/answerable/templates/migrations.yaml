{{- /*
The migrations, before every install and upgrade and after the ops bootstrap (D10): ID's from its image; the Toolbox's, the admin MCP's
and the standalone server's databases, one Job each, and every MCP of mcps.json in one Job, mcps-migrate, from the mcps image. Each mounts
only the owner logins of its own databases, which the services never receive: the admin MCP's credential stays in admin-migrate (D15).
They run whether or not a server is rendered, so a schema is never behind its image. Helm runs hooks one at a time in weight order and waits
for each: id-migrate -10, toolbox-migrate -9, admin-migrate -8, standalone-migrate -7, mcps-migrate -6. No Job depends on another's work
beyond that order: each migrates databases no other Job touches, which the bootstrap (-20) has made. The last run of each Job stays for its
logs until the next upgrade replaces it.
*/ -}}
{{- define "answerable.migration" -}}
{{- $root := .root -}}
{{- $scope := dict "root" $root "component" "migrate" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  labels:
    {{- include "answerable.labels" $scope | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ $root.Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ $root.Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "answerable.labels" $scope | nindent 8 }}
    spec:
      serviceAccountName: migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- include "answerable.podCommon" (dict "root" $root "database" true) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "answerable.image" (dict "root" $root "name" .image) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: {{ toJson .command }}
          env:
            {{- .env | nindent 12 }}
          resources:
            {{- toYaml $root.Values.migrations.resources | nindent 12 }}
          securityContext:
            {{- include "answerable.containerSecurityContext" $root | nindent 12 }}
          volumeMounts:
            {{- include "answerable.volumeMounts" (dict "root" $root "database" true) | nindent 12 }}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
  labels:
    {{- include "answerable.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
{{ include "answerable.migration" (dict
  "root" .
  "name" "id-migrate"
  "image" "id"
  "weight" -10
  "command" (list "bun" "--no-install" "apps/id/dist/scripts/migrate.js")
  "env" (printf "%s\n- name: DATABASE_RUNTIME_ROLE\n  value: %s" (include "answerable.secretEnv" (dict "name" "DATABASE_MIGRATION_URL" "secret" "id-database-owner" "key" "DATABASE_MIGRATION_URL")) (.Values.id.runtimeRole | quote))) }}
---
{{ include "answerable.migration" (dict
  "root" .
  "name" "toolbox-migrate"
  "image" "mcps"
  "weight" -9
  "command" (list "bun" "mcps/toolbox/scripts/migrate.ts")
  "env" (printf "%s\n- name: TOOLBOX_DATABASE_RUNTIME_ROLE\n  value: %s" (include "answerable.secretEnv" (dict "name" "TOOLBOX_DATABASE_MIGRATION_URL" "secret" "toolbox-database-owner" "key" "TOOLBOX_DATABASE_MIGRATION_URL")) (.Values.toolbox.runtimeRole | quote))) }}
---
{{- $adminEnv := printf "%s\n- name: ADMIN_DATABASE_RUNTIME_ROLE\n  value: %s" (include "answerable.secretEnv" (dict "name" "ADMIN_DATABASE_MIGRATION_URL" "secret" "admin-database-owner" "key" "ADMIN_DATABASE_MIGRATION_URL")) (.Values.adminMcp.runtimeRole | quote) }}
{{ include "answerable.migration" (dict
  "root" .
  "name" "admin-migrate"
  "image" "mcps"
  "weight" -8
  "command" (list "bun" "mcps/admin/scripts/migrate.ts")
  "env" $adminEnv) }}
---
{{ include "answerable.migration" (dict
  "root" .
  "name" "standalone-migrate"
  "image" "mcps"
  "weight" -7
  "command" (list "bun" "mcps/standalone/scripts/migrate.ts")
  "env" (printf "%s\n- name: STANDALONE_DATABASE_RUNTIME_ROLE\n  value: %s" (include "answerable.secretEnv" (dict "name" "STANDALONE_DATABASE_MIGRATION_URL" "secret" "standalone-database-owner" "key" "STANDALONE_DATABASE_MIGRATION_URL")) (.Values.standalone.runtimeRole | quote))) }}
---
{{- /*
Every MCP of mcps.json, in its order: each shared one through the migrator login of answerable_mcps, as its owner role, and each own one as its
database's owner login (mcps/standalone/scripts/migrate-mcps.ts). One MCP's failure fails the Job, and so the release.
*/ -}}
{{- $mcps := fromJsonArray (include "answerable.mcps" .) }}
{{- $mcpsEnv := list (include "answerable.secretEnv" (dict "name" "MCPS_DATABASE_MIGRATION_URL" "secret" "mcps-database-owner" "key" "MCPS_DATABASE_MIGRATION_URL")) (printf "- name: MCPS_DECLARED\n  value: %s" (toJson $mcps | quote)) }}
{{- range $mcps }}
{{- if eq .database "own" }}
{{- $mcpsEnv = append $mcpsEnv (include "answerable.secretEnv" (dict "name" (printf "MCP_%s_DATABASE_MIGRATION_URL" (upper .name)) "secret" (printf "mcp-%s-database-owner" .name) "key" "DATABASE_MIGRATION_URL")) }}
{{- end }}
{{- end }}
{{ include "answerable.migration" (dict
  "root" .
  "name" "mcps-migrate"
  "image" "mcps"
  "weight" -6
  "command" (list "bun" "mcps/standalone/scripts/migrate-mcps.ts")
  "env" (join "\n" $mcpsEnv)) }}
