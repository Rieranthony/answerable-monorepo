{{- /*
The Toolbox, from the mcps image. Configuration: apps/web/content/docs/toolbox/index.mdx. It reaches ID at its public issuer, and serves every MCP
of mcps.json: the shared ones through one pool to answerable_mcps, each own one through its database's runtime login. Its hub is on
hostnames.toolbox; each standalone and both MCP is the resource <origin>/<name>/mcp on hostnames.mcp (D-1), whose Ingress, rendered while there
is one, has two Prefix paths per MCP, /<name>/ and /.well-known/oauth-protected-resource/<name>/, so no MCP's path is another's prefix and the
hub and /health stay off that host.
*/ -}}
{{- define "answerable.toolboxEnv" -}}
- name: TOOLBOX_ID_ISSUER
  value: {{ include "answerable.idUrl" . | quote }}
- name: TOOLBOX_RESOURCE_URL
  value: {{ printf "%s/mcp" (include "answerable.toolboxUrl" .) | quote }}
- name: TOOLBOX_STANDALONE_ORIGIN
  value: {{ include "answerable.origin" (dict "root" . "host" .Values.hostnames.mcp) | quote }}
- name: TOOLBOX_ID_ADMIN_RESOURCE
  value: {{ printf "%s/api/admin" (include "answerable.idUrl" .) | quote }}
- name: TOOLBOX_ID_CLIENT_ID
  value: {{ .Values.toolbox.clientId | quote }}
{{ include "answerable.secretEnv" (dict "name" "TOOLBOX_ID_CLIENT_SECRET" "secret" "toolbox-id-client" "key" "TOOLBOX_ID_CLIENT_SECRET") }}
{{ include "answerable.secretEnv" (dict "name" "TOOLBOX_DATABASE_URL" "secret" "toolbox-database" "key" "TOOLBOX_DATABASE_URL") }}
{{ include "answerable.secretEnv" (dict "name" "TOOLBOX_MCPS_DATABASE_URL" "secret" "toolbox-mcps-database" "key" "TOOLBOX_MCPS_DATABASE_URL") }}
{{- range fromJsonArray (include "answerable.mcps" .) }}
{{- if eq .database "own" }}
{{ include "answerable.secretEnv" (dict "name" (printf "TOOLBOX_MCP_%s_DATABASE_URL" (upper .name)) "secret" (printf "mcp-%s-database" .name) "key" "DATABASE_URL") }}
{{- end }}
{{- end }}
{{- end -}}
{{ include "answerable.server" (dict
  "root" .
  "component" "toolbox"
  "image" "mcps"
  "command" (list "bun" "mcps/toolbox/src/server.ts")
  "port" 47400
  "values" .Values.toolbox
  "host" .Values.hostnames.toolbox
  "env" (include "answerable.toolboxEnv" .)
  "readiness" "/health"
  "liveness" ""
  "clientSecret" "toolbox-id-client") }}
{{- $paths := list }}
{{- range fromJsonArray (include "answerable.mcps" .) }}
{{- if ne .serve "toolbox" }}
{{- $paths = concat $paths (list (printf "/%s/" .name) (printf "/.well-known/oauth-protected-resource/%s/" .name)) }}
{{- end }}
{{- end }}
{{- if $paths }}
---
{{ include "answerable.ingress" (dict "root" . "name" "mcp" "component" "toolbox" "host" .Values.hostnames.mcp "paths" $paths) }}
{{- end }}
