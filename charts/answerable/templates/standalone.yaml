{{- /*
The standalone server, from the mcps image, rendered only while mcps.json has a standalone or both MCP: one Deployment that serves each of
them by path on hostnames.mcp, as the resource <origin>/<name>/mcp (D2). Its Ingress has two Prefix paths per MCP, /<name>/ and
/.well-known/oauth-protected-resource/<name>/, so no MCP's path is another's prefix and /health stays inside the cluster. It reads who is
calling from ID through its machine client, standalone-hub, and waits at zero replicas until ops register has written that client's Secret.
Configuration: mcps/standalone/src/environment.ts.
*/ -}}
{{- $served := fromJsonArray (include "answerable.standaloneMcps" .) }}
{{- define "answerable.standaloneEnv" -}}
- name: STANDALONE_ORIGIN
  value: {{ include "answerable.origin" (dict "root" . "host" .Values.hostnames.mcp) | quote }}
- name: STANDALONE_ID_ISSUER
  value: {{ include "answerable.idUrl" . | quote }}
- name: STANDALONE_ID_ADMIN_RESOURCE
  value: {{ printf "%s/api/admin" (include "answerable.idUrl" .) | quote }}
- name: STANDALONE_ID_CLIENT_ID
  value: {{ .Values.standalone.clientId | quote }}
{{ include "answerable.secretEnv" (dict "name" "STANDALONE_ID_CLIENT_SECRET" "secret" "standalone-id-client" "key" "STANDALONE_ID_CLIENT_SECRET") }}
{{ include "answerable.secretEnv" (dict "name" "STANDALONE_DATABASE_URL" "secret" "standalone-database" "key" "STANDALONE_DATABASE_URL") }}
{{ include "answerable.secretEnv" (dict "name" "STANDALONE_MCPS_DATABASE_URL" "secret" "standalone-mcps-database" "key" "STANDALONE_MCPS_DATABASE_URL") }}
{{- include "answerable.ownMcpEnv" (dict "root" . "serves" (list "standalone" "both") "prefix" "STANDALONE") }}
{{- end -}}
{{- if $served }}
{{- $paths := list }}
{{- range $served }}
{{- $paths = concat $paths (list (printf "/%s/" .name) (printf "/.well-known/oauth-protected-resource/%s/" .name)) }}
{{- end }}
{{ include "answerable.server" (dict
  "root" .
  "component" "standalone"
  "image" "mcps"
  "command" (list "bun" "mcps/standalone/src/server.ts")
  "port" 47510
  "values" .Values.standalone
  "host" .Values.hostnames.mcp
  "paths" $paths
  "env" (include "answerable.standaloneEnv" .)
  "readiness" "/health"
  "liveness" ""
  "clientSecret" "standalone-id-client") }}
{{- end }}
