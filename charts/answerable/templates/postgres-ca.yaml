{{- /*
The database's certificate authority, which every pod mounts at /etc/ssl/db/ca.pem: the sslrootcert of each database URL.
It comes from database.caPem, which the deploy passes with --set-file database.caPem=infra/civo/envs/<environment>/database-ca.pem
(written by bun run setup database-ca). A hook before the ops bootstrap and the migrations (weights -20 to -8), because
hooks run before the release's own resources and their pods mount it; recreated on each upgrade like the migrate account.
*/ -}}
{{- $pem := .Values.database.caPem -}}
{{- if not $pem }}
{{- fail "database.caPem is empty: every service verifies the database against it. Pass --set-file database.caPem=infra/civo/envs/<environment>/database-ca.pem (bun run setup database-ca writes it)" }}
{{- end }}
{{- if not (and (contains "-----BEGIN CERTIFICATE-----" $pem) (contains "-----END CERTIFICATE-----" $pem)) }}
{{- fail "database.caPem must be a PEM certificate chain (-----BEGIN CERTIFICATE----- … -----END CERTIFICATE-----): the database's CA from infra/civo/envs/<environment>/database-ca.pem" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.database.caConfigMap }}
  labels:
    {{- include "answerable.labels" (dict "root" . "component" "database") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  ca.pem: {{ $pem | toJson }}
