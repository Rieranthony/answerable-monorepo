{{- /*
The ops image's Jobs (infra/ops/README.md), each switched on for one upgrade by the pipeline (deploy.ts):
- bootstrap, before the migrations, writes the database's certificate authority to the ConfigMap postgres-ca on first
  use, creates the databases and their logins with the postgres-admin login, provisions each MCP of mcps.json (OPS_MCPS):
  its schema in answerable_mcps, or its own database and logins, and writes the URL Secrets the migrations and
  the services read;
- register, on every deploy after the release and once ID is up, as its own machine client, ops-register, which its first
  run mints with ID's root secret (or, once, a staff token from ops-staff-token) and keeps in ops-id-client: registers the
  Toolbox and the admin MCP in ID, registers each standalone or both MCP of mcps.json (OPS_MCPS, with its scopes) at
  hostnames.mcp, writes the client Secrets and starts the servers, which wait at zero replicas until their Secret exists
  (_server.tpl), and, with id.staffDomain and id.entraTenant, connects the staff domain and directory to the platform
  organisation;
- make-admin, after register, puts the first staff member, who has signed in once, in the owner and platform-admins
  groups with ID's root secret, which locks that secret.
The ServiceAccount of bootstrap and register may read and patch exactly the Secrets and, for bootstrap, the ConfigMap
their Jobs own, the Secrets of each own MCP of mcps.json among them, and, for register, the Deployments it starts.
make-admin calls only ID and mounts no token. Their NetworkPolicy is in network-policies.yaml.
*/ -}}
{{- if .Values.images.ops.repository }}
{{- $scope := dict "root" . "component" "ops" }}
{{- $mcps := fromJsonArray (include "answerable.mcps" .) }}
{{- $switches := dict "bootstrap" .Values.ops.bootstrap "register" .Values.ops.register "make-admin" .Values.ops.makeAdmin }}
{{- if .Values.ops.makeAdmin }}
{{- $_ := required "ops.makeAdmin needs ops.adminEmail: the email of the staff member who signed in once" .Values.ops.adminEmail }}
{{- end }}
{{- if or .Values.ops.bootstrap .Values.ops.register }}
{{- $phases := list }}
{{- $secrets := list }}
{{- if .Values.ops.bootstrap }}
{{- $phases = concat $phases (list "pre-install" "pre-upgrade") }}
{{- /* The Secrets bootstrap writes, as infra/ops/src/bootstrap.ts's databasesFor names them. */}}
{{- $secrets = concat $secrets (list "id-database-owner" "id-database" "toolbox-database-owner" "toolbox-database" "admin-database-owner" "admin-database" "mcps-database-owner" "toolbox-mcps-database") }}
{{- range $mcps }}
{{- if eq .database "own" }}
{{- $secrets = concat $secrets (list (printf "mcp-%s-database-owner" .name) (printf "mcp-%s-database" .name)) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.ops.register }}
{{- $phases = concat $phases (list "post-install" "post-upgrade") }}
{{- $secrets = concat $secrets (list "ops-id-client" "toolbox-id-client" "admin-id-client") }}
{{- end }}
{{- range $kind := list "ServiceAccount" "Role" "RoleBinding" }}
---
apiVersion: {{ if eq $kind "ServiceAccount" }}v1{{ else }}rbac.authorization.k8s.io/v1{{ end }}
kind: {{ $kind }}
metadata:
  name: ops
  labels:
    {{- include "answerable.labels" $scope | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $phases }}
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
{{- if eq $kind "ServiceAccount" }}
# Only the ops Jobs' pods mount its token, and they say so themselves.
automountServiceAccountToken: false
{{- else if eq $kind "Role" }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ toJson $secrets }}
    verbs: [get, patch]
  # Kubernetes cannot limit a create to names (the name is in the request's body), so this rule names none. The Jobs create
  # a Secret only when reading it by name above found none.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- if $.Values.ops.bootstrap }}
  # The database's certificate authority, which bootstrap writes once, when reading it found none.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [postgres-ca]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  {{- end }}
  {{- if $.Values.ops.register }}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [toolbox, admin-mcp]
    verbs: [get, patch]
  {{- end }}
{{- else }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops
subjects:
  - kind: ServiceAccount
    name: ops
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- range $job := list "bootstrap" "register" "make-admin" }}
{{- if get $switches $job }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ops-{{ $job }}
  labels:
    {{- include "answerable.labels" $scope | nindent 4 }}
  annotations:
    helm.sh/hook: {{ ternary "pre-install,pre-upgrade" "post-install,post-upgrade" (eq $job "bootstrap") }}
    # Bootstrap before the migrations (-10 to -6); register after every resource of the release is up; make-admin last.
    helm.sh/hook-weight: {{ get (dict "bootstrap" "-20" "register" "10" "make-admin" "20") $job | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # One attempt: a failure needs a person to read the log, and running the command again is safe once they have.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $.Values.ops.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $.Values.ops.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "answerable.labels" $scope | nindent 8 }}
    spec:
      {{- if eq $job "make-admin" }}
      # It calls only ID: no Kubernetes token.
      automountServiceAccountToken: false
      {{- else }}
      serviceAccountName: ops
      # The token the Jobs read and write Secrets with, through the Kubernetes API.
      automountServiceAccountToken: true
      {{- end }}
      restartPolicy: Never
      {{- include "answerable.podCommon" (dict "root" $ "database" false) | nindent 6 }}
      containers:
        - name: ops
          image: {{ include "answerable.image" (dict "root" $ "name" "ops") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["bun", "infra/ops/src/cli.ts", {{ $job | quote }}]
          env:
            {{- if eq $job "bootstrap" }}
            - name: OPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The managed database's administrative login (CREATEDB and CREATEROLE), as a URL with sslmode=verify-full:
            # a Secret Terraform writes. Bootstrap verifies the database against the ConfigMap postgres-ca, which it
            # writes on first use.
            {{- include "answerable.secretEnv" (dict "name" "OPS_DATABASE_ADMIN_URL" "secret" "postgres-admin" "key" "OPS_DATABASE_ADMIN_URL") | nindent 12 }}
            - name: OPS_MCPS
              value: {{ toJson $mcps | quote }}
            {{- else }}
            {{- if eq $job "register" }}
            - name: OPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPS_TOOLBOX_URL
              value: {{ include "answerable.toolboxUrl" $ | quote }}
            - name: OPS_ADMIN_MCP_URL
              value: {{ include "answerable.adminMcpUrl" $ | quote }}
            - name: OPS_MCP_URL
              value: {{ include "answerable.origin" (dict "root" $ "host" $.Values.hostnames.mcp) | quote }}
            - name: OPS_MCPS
              value: {{ toJson $mcps | quote }}
            - name: OPS_CLAUDE_CALLBACK_PORT
              value: {{ $.Values.ops.claudeCallbackPort | quote }}
            - name: OPS_START_DEPLOYMENTS
              value: {{ include "answerable.opsStartDeployments" $ | quote }}
            {{- with $.Values.id.staffDomain }}
            - name: OPS_STAFF_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.id.entraTenant }}
            - name: OPS_ENTRA_TENANT
              value: {{ . | quote }}
            {{- end }}
            # A staff token, needed once only if ID refuses the root secret (root_locked) before register has minted its own
            # client (infra/README.md, Register again):
            # kubectl -n answerable create secret generic ops-staff-token --from-literal=OPS_ID_TOKEN=<token>
            - name: OPS_ID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-staff-token
                  key: OPS_ID_TOKEN
                  optional: true
            {{- else }}
            - name: OPS_ADMIN_EMAIL
              value: {{ $.Values.ops.adminEmail | quote }}
            {{- end }}
            - name: OPS_ID_URL
              value: {{ include "answerable.idUrl" $ | quote }}
            - name: OPS_ID_ROOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: id-env
                  key: ROOT_ADMIN_SECRET
                  optional: true
            {{- end }}
            {{- include "answerable.commonEnv" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.ops.resources | nindent 12 }}
          securityContext:
            {{- include "answerable.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- include "answerable.volumeMounts" (dict "root" $ "database" false) | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
