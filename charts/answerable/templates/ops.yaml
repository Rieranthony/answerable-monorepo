{{- /*
The ops image's Jobs (infra/ops/README.md), each switched on for one upgrade by the pipeline (deploy.ts run-job):
bootstrap, before the migrations, creates the databases and their logins with the postgres-admin login and writes the URL
Secrets the migrations and the services read; register, after the release and once ID is up, registers the Toolbox and the
admin MCP in ID, writes their client Secrets and starts the two servers, which wait at zero replicas until their Secret
exists (_server.tpl). Their ServiceAccount may read and patch exactly the Secrets this run's Jobs own and, for register,
the two Deployments it starts. Its NetworkPolicy is in network-policies.yaml.
*/ -}}
{{- if and .Values.images.ops.repository (or .Values.ops.bootstrap .Values.ops.register) }}
{{- $scope := dict "root" . "component" "ops" }}
{{- $phases := list }}
{{- $secrets := list }}
{{- if .Values.ops.bootstrap }}
{{- $phases = concat $phases (list "pre-install" "pre-upgrade") }}
{{- $secrets = concat $secrets (list "id-database-owner" "id-database" "toolbox-database-owner" "toolbox-database" "admin-database-owner" "admin-database") }}
{{- end }}
{{- if .Values.ops.register }}
{{- $phases = concat $phases (list "post-install" "post-upgrade") }}
{{- $secrets = concat $secrets (list "toolbox-id-client" "admin-id-client") }}
{{- end }}
{{- range $kind := list "ServiceAccount" "Role" "RoleBinding" }}
---
apiVersion: {{ if eq $kind "ServiceAccount" }}v1{{ else }}rbac.authorization.k8s.io/v1{{ end }}
kind: {{ $kind }}
metadata:
  name: ops
  labels:
    {{- include "answerable.labels" $scope | nindent 4 }}
  annotations:
    helm.sh/hook: {{ join "," $phases }}
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
{{- if eq $kind "ServiceAccount" }}
# Only the ops Jobs' pods mount its token, and they say so themselves.
automountServiceAccountToken: false
{{- else if eq $kind "Role" }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ toJson $secrets }}
    verbs: [get, patch]
  # Kubernetes cannot limit a create to names (the name is in the request's body), so this rule names none. The Jobs create
  # a Secret only when reading it by name above found none.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- if $.Values.ops.register }}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [toolbox, admin-mcp]
    verbs: [get, patch]
  {{- end }}
{{- else }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops
subjects:
  - kind: ServiceAccount
    name: ops
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- range $job := list "bootstrap" "register" }}
{{- if index $.Values.ops $job }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ops-{{ $job }}
  labels:
    {{- include "answerable.labels" $scope | nindent 4 }}
  annotations:
    helm.sh/hook: {{ ternary "pre-install,pre-upgrade" "post-install,post-upgrade" (eq $job "bootstrap") }}
    # Bootstrap before the migrations (-10 to -8); register after every resource of the release is up.
    helm.sh/hook-weight: {{ ternary "-20" "10" (eq $job "bootstrap") | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # One attempt: a failure needs a person to read the log, and running the command again is safe once they have.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $.Values.ops.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $.Values.ops.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "answerable.labels" $scope | nindent 8 }}
    spec:
      serviceAccountName: ops
      # The token the Jobs read and write Secrets with, through the Kubernetes API.
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- include "answerable.podCommon" $ | nindent 6 }}
      containers:
        - name: ops
          image: {{ include "answerable.image" (dict "root" $ "name" "ops") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["bun", "infra/ops/src/cli.ts", {{ $job | quote }}]
          env:
            - name: OPS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if eq $job "bootstrap" }}
            # The managed database's administrative login (CREATEDB and CREATEROLE), as a URL whose sslrootcert is
            # /etc/ssl/db/ca.pem: a Secret the deploy applies from the sops file.
            {{- include "answerable.secretEnv" (dict "name" "OPS_DATABASE_ADMIN_URL" "secret" "postgres-admin" "key" "OPS_DATABASE_ADMIN_URL") | nindent 12 }}
            {{- with $.Values.database.host }}
            - name: OPS_DATABASE_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- with $.Values.database.port }}
            - name: OPS_DATABASE_PORT
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: OPS_ID_URL
              value: {{ include "answerable.idUrl" $ | quote }}
            - name: OPS_TOOLBOX_URL
              value: {{ include "answerable.toolboxUrl" $ | quote }}
            - name: OPS_ADMIN_MCP_URL
              value: {{ include "answerable.adminMcpUrl" $ | quote }}
            - name: OPS_PLATFORM_SLUG
              value: {{ $.Values.id.platformOrganization.slug | quote }}
            - name: OPS_CLAUDE_CALLBACK_PORT
              value: {{ $.Values.ops.claudeCallbackPort | quote }}
            - name: OPS_START_DEPLOYMENTS
              value: {{ include "answerable.opsStartDeployments" $ | quote }}
            # A staff token, once ID refuses the root secret (root_locked):
            # kubectl -n answerable create secret generic ops-staff-token --from-literal=OPS_ID_TOKEN=<token>
            - name: OPS_ID_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-staff-token
                  key: OPS_ID_TOKEN
                  optional: true
            - name: OPS_ID_ROOT_SECRET
              valueFrom:
                secretKeyRef:
                  name: id-env
                  key: ROOT_ADMIN_SECRET
                  optional: true
            {{- end }}
            {{- include "answerable.commonEnv" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.ops.resources | nindent 12 }}
          securityContext:
            {{- include "answerable.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            {{- include "answerable.volumeMounts" $ | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
