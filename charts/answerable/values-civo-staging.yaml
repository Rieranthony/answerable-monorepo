# Staging on Civo, in the answerable-staging account (D28), behind Cloudflare on answerable-staging.uk (D12). The pipeline
# sets the images and idEnvChecksum; Terraform writes the ConfigMap trusted-proxies and the Secrets postgres-admin and
# origin-tls; everything else about the environment is here.

hostnames:
  id: id.answerable-staging.uk
  toolbox: toolbox.answerable-staging.uk
  adminMcp: admin-mcp.answerable-staging.uk

id:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
  # The platform applications' endpoint origins (docs/06).
  trustedOrigins:
    - https://login.microsoftonline.com
    - https://graph.microsoft.com
    - https://accounts.google.com
    - https://oauth2.googleapis.com
    - https://www.googleapis.com
    - https://openidconnect.googleapis.com
  # The staff email domain and the staff directory's Microsoft Entra tenant, the ones the local ID setup uses. The
  # register Job adds the domain to the platform organisation and connects the tenant through Answerable's Microsoft
  # platform application, whose client ID and secret are the environment's MICROSOFT_* secrets, never values here.
  staffDomain: omniaccelerator.ai
  entraTenant: 999a3be8-1a6c-4f1f-beb1-d6f6c2114bc6

toolbox:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 3 }

adminMcp:
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 3 }

networkPolicy:
  # The Kubernetes API for the ops Jobs: Civo runs the control plane outside the cluster, at a public endpoint on 6443
  # (infra/civo/README.md). Its address is the cluster module's api_endpoint output; until this file carries it, any
  # address on 6443, for the ops Jobs' pods only.
  kubernetesApi:
    - ipBlock:
        cidr: 0.0.0.0/0
  kubernetesApiPorts: [6443]
  # The Civo database sits in the environment's private network (network_cidr in infra/civo/envs/staging.tfvars).
  database:
    - ipBlock:
        cidr: 10.10.0.0/24
