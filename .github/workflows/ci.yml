name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://answerable:answerable@localhost:47432/answerable_id
      TEST_DATABASE_URL: postgres://answerable:answerable@localhost:47432/answerable_id_test
      BETTER_AUTH_URL: http://localhost:47300
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Push test schema
        run: bun --filter @answerable/id db:test:push

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test with coverage
        run: bun --filter @answerable/id test:coverage

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres
