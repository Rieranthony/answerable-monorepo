name: CI

# Every push gets the same checks; the two shipping workflows call this one, so a tagged commit is built only once
# these have passed. No secret reaches any job here.
on:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://answerable:answerable@localhost:47432/answerable_id_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Prove fresh and repeated migration
        run: bun --filter @answerable/id test:migrations

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test web
        run: bun --filter web test

      - name: Test countries
        run: bun --filter @answerable/countries test

      - name: Install MCP browser test runtime
        working-directory: packages/acceptance
        run: bun x playwright install --with-deps chromium

      - name: Test MCP foundation and Apps interaction
        run: bun run mcp:test

      - name: Test real ID login and MCP Apps
        run: bun run mcp:test:e2e

      - name: Test with coverage
        run: bun --filter @answerable/id test:coverage

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

  # Terraform, Helm, policy and workflow checks with no cloud credential: `bun run infra:check`.
  infra-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: terraform helm kubeconform tflint trivy actionlint

      - name: Check infrastructure code
        run: bun run infra:check

  # The four images built and run in a kind cluster with both charts, as Civo runs them: amd64, Civo's architecture.
  # Only after validate, so a red suite never builds images (bun run infra:test, infra/k8s/local/README.md).
  containers:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/setup-tools
        with:
          tools: kind kubectl helm kubeconform

      # The staff sign-in drives ID's pages in Chromium, through the acceptance kit.
      - name: Install the browser for the staff sign-in
        working-directory: packages/acceptance
        run: bun x playwright install --with-deps chromium

      - name: Prove the images and the charts in a kind cluster
        run: bun run infra:test
