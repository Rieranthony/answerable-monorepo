name: Promote production

# A tag production/<name> on a commit of main ships that commit to production, with the images staging built for it:
# the signatures of every image of infra/pipeline/images.json are verified first, then the run waits for the production environment's reviewer, applies the
# production infrastructure, deploys exactly the verified digests and smoke-tests. Production is never rebuilt, and a
# commit staging never shipped is refused. To roll back, tag an earlier commit that staging shipped.
#
# What this does and which secrets the production environment holds: infra/pipeline/README.md.

on:
  push:
    tags:
      - production/*

# One run at a time and never cancelled halfway: a cancelled Terraform apply or Helm upgrade leaves a lock behind.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/rieranthony/answerable
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # The commit is on main, and each image of infra/pipeline/images.json was built and signed by deploy-staging.yml on a staging tag, so
  # they were built from a commit that passed CI and ran on staging. The digests the tag points to are read once,
  # verified, and handed to the deploy, so a tag moved afterwards changes nothing.
  verify:
    name: Verify the staging build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.verify.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag names a commit of main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; tag a commit of main"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the image signatures
        id: verify
        run: |
          identity="^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/deploy-staging.yml@refs/tags/staging/"
          digests=()
          for image in $(jq -r '.[].name' infra/pipeline/images.json); do
            if ! digest=$(docker buildx imagetools inspect "$REGISTRY/$image:$IMAGE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null); then
              echo "::error::$REGISTRY/$image:$IMAGE_TAG does not exist: staging has not shipped $GITHUB_SHA; tag it staging/<name> first"
              exit 1
            fi
            cosign verify "$REGISTRY/$image@$digest" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $image:$IMAGE_TAG is $digest"
            digests+=("$image=$digest")
          done
          echo "digests=${digests[*]}" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME ships \`$IMAGE_TAG\`, verified." >> "$GITHUB_STEP_SUMMARY"

  # One job, so that the environment's reviewer approves once for the whole promotion. The Civo, Cloudflare and GitHub
  # tokens reach the Terraform steps only; the deploy step holds the deployer token and ID's secrets.
  production:
    name: Apply and deploy to production
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
    env:
      IMAGE_DIGESTS: ${{ needs.verify.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: helm kubectl terraform

      - name: Terraform init
        env:
          TF_IN_AUTOMATION: "1"
          STATE_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          STATE_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
        run: infra/civo/terraform.sh production init -input=false

      - name: Terraform apply, the cluster and the database first
        env:
          TF_IN_AUTOMATION: "1"
          CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          STATE_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: infra/civo/terraform.sh production apply -input=false -auto-approve -target=module.cluster -target=module.database -target=module.ingress_firewall

      - name: Terraform apply
        env:
          TF_IN_AUTOMATION: "1"
          CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STATE_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          STATE_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: infra/civo/terraform.sh production apply -input=false -auto-approve

      - name: Deploy
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ROOT_ADMIN_SECRET: ${{ secrets.ROOT_ADMIN_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRETS: ${{ secrets.BETTER_AUTH_SECRETS }}
        run: |
          # The digests verified above: <image>=sha256:<hex>, space-separated, one for each image of infra/pipeline/images.json.
          read -ra pairs <<< "$IMAGE_DIGESTS"
          pins=()
          for pair in "${pairs[@]}"; do pins+=(--image-digest "$pair"); done
          if [ "${#pairs[@]}" -ne "$(jq length infra/pipeline/images.json)" ]; then
            echo "::error::expected the verified digest of every image of infra/pipeline/images.json, got '$IMAGE_DIGESTS'"
            exit 1
          fi
          bun infra/pipeline/src/cli.ts deploy --environment production --image-tag "$IMAGE_TAG" "${pins[@]}"

      - name: Summarise
        run: echo "Production runs \`$IMAGE_TAG\` ($GITHUB_REF_NAME)." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test production
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Smoke test
        run: |
          status=0
          bun infra/pipeline/src/cli.ts smoke --environment production --wait 300 | tee smoke.txt || status=$?
          { echo '```text'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
