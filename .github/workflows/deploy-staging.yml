name: Deploy staging

# A tag staging/<name> on a commit of main ships that commit to staging: CI, the staging infrastructure applied by
# Terraform, the images of infra/pipeline/images.json built for amd64 (Civo's nodes), signed and tagged sha-<commit>, the
# release upgraded by digest, and a smoke test through the public hostnames. To roll back, tag an earlier commit of main.
#
# What this does and which secrets the staging environment holds: infra/pipeline/README.md.

on:
  push:
    tags:
      - staging/*

# One run at a time, in order, and never cancelled halfway: a cancelled Terraform apply or Helm upgrade leaves a lock
# behind. A tag that arrives meanwhile waits.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/rieranthony/answerable
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # A tag ships only a commit that is on main. It also reads the images to build from infra/pipeline/images.json.
  guard:
    name: The tag names a commit of main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; tag a commit of main"
            exit 1
          fi
          echo "$GITHUB_REF_NAME ships $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: The images to build
        id: images
        run: echo "images=$(jq -c . infra/pipeline/images.json)" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Staging's infrastructure, before every deploy, so that the code that ships is what runs. A no-op when nothing
  # changed. The first apply creates the cluster and the database before anything that runs inside the cluster, then
  # applies the rest; both steps are no-ops afterwards. Terraform also writes the deploy credentials into this
  # environment (KUBE_SERVER, KUBE_CA, KUBE_TOKEN), which the deploy job reads when it starts.
  infra:
    name: Apply the staging infrastructure
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "1"
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STATE_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
      STATE_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
      # The github provider: the environment's own policies and the three deploy secrets.
      GITHUB_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: terraform

      - name: Terraform init
        run: infra/civo/terraform.sh staging init -input=false

      - name: Terraform apply, the cluster and the database first
        run: infra/civo/terraform.sh staging apply -input=false -auto-approve -target=module.cluster -target=module.database -target=module.ingress_firewall

      - name: Terraform apply
        run: infra/civo/terraform.sh staging apply -input=false -auto-approve

  # One build per image of infra/pipeline/images.json, for linux/amd64, pushed as sha-<commit> and signed keyless on its
  # digest: the signature names this workflow on a staging tag, which promote-production.yml checks before it deploys.
  build:
    name: Build ${{ matrix.name }}
    needs: [guard, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.guard.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ env.IMAGE_TAG }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=answerable-${{ matrix.name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/${{ matrix.name }}@$DIGEST"

  deploy:
    name: Deploy to staging
    needs: [infra, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: helm kubectl

      # No cloud key is in scope here: the deployer ServiceAccount's token reaches the answerable namespace only, and
      # ID's secrets go from the environment into the Secret id-env on kubectl's standard input.
      - name: Deploy
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ROOT_ADMIN_SECRET: ${{ secrets.ROOT_ADMIN_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BETTER_AUTH_SECRETS: ${{ secrets.BETTER_AUTH_SECRETS }}
        run: bun infra/pipeline/src/cli.ts deploy --environment staging --image-tag "$IMAGE_TAG"

      - name: Summarise
        run: echo "Staging runs \`$IMAGE_TAG\` ($GITHUB_REF_NAME)." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test staging
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      # Five minutes of retries cover the edge catching up after a rollout.
      - name: Smoke test
        run: |
          status=0
          bun infra/pipeline/src/cli.ts smoke --environment staging --wait 300 | tee smoke.txt || status=$?
          { echo '```text'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
