name: Deploy staging

# A push to main runs CI, builds and signs the four images once, upgrades the staging release and smoke-tests it
# through the public hostnames. A manual run redeploys an image that already exists, which is how staging rolls back.
# What this does and which secrets it needs: infra/pipeline/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: The image tag to redeploy, sha- and the commit SHA. Nothing is built.
        required: true
        type: string

# One run at a time, in order, and never cancelled halfway: a cancelled Helm upgrade leaves the release locked.
# A push that arrives meanwhile waits, and a newer one replaces it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/rieranthony/answerable
  # The runner and the platform go together: the nodes must run the architecture the images are built for.
  IMAGE_PLATFORM: linux/arm64

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Build ${{ matrix.image }}
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: id
            dockerfile: apps/id/Dockerfile
          - image: toolbox
            dockerfile: mcps/toolbox/Dockerfile
          - image: admin-mcp
            dockerfile: mcps/admin/Dockerfile
          - image: ops
            dockerfile: infra/ops/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=answerable-${{ matrix.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature names this workflow on main, which promote-production.yml checks before it deploys.
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  deploy:
    name: Deploy to staging
    needs: [ci, images]
    # A manual run skips ci and images; a failure of either stops the deploy.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag || format('sha-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: sops helm kubectl

      # No cloud key is in scope here: the deployer ServiceAccount's token only reaches the answerable namespace.
      - name: Deploy
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: bun infra/pipeline/src/cli.ts deploy --environment staging --image-tag "$IMAGE_TAG" --bootstrap

      - name: Summarise
        run: echo "Staging runs \`$IMAGE_TAG\`." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test staging
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      # Five minutes of retries cover the first certificate and the edge catching up after a rollout.
      - name: Smoke test
        run: |
          status=0
          bun infra/pipeline/src/cli.ts smoke --environment staging --wait 300 | tee smoke.txt || status=$?
          { echo '```text'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
