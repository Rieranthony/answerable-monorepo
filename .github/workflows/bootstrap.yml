name: Bootstrap an environment

# Once per environment, before its first tag: creates the Terraform state bucket and its credential in the Civo
# account, and writes into the GitHub environment what no person should ever see: the state credential and ID's three
# random secrets. Each is written only when it is missing, so the run is safe to repeat. With `rotate`, one of ID's
# secrets is replaced instead (the next tag applies it). Nothing here is printed.
#
# Before running it the owner creates the GitHub environment and pastes five secrets into it: CIVO_TOKEN,
# CLOUDFLARE_API_TOKEN, MICROSOFT_CLIENT_ID, MICROSOFT_CLIENT_SECRET and GH_SECRETS_TOKEN (infra/README.md, First run).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to bootstrap
        required: true
        type: choice
        options:
          - staging
          - production
      rotate:
        description: Replace one of ID's secrets instead of filling in what is missing
        required: true
        default: none
        type: choice
        options:
          - none
          - ROOT_ADMIN_SECRET

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: Bootstrap ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      ROTATE: ${{ inputs.rotate }}
      BUCKET: answerable-${{ inputs.environment }}-tfstate
      CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      CIVO_REGION: LON1
      GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          tools: civo

      - name: Check the five pasted secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          for name in CIVO_TOKEN CLOUDFLARE_API_TOKEN MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET GH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::the environment $ENVIRONMENT has no secret ${name/GH_TOKEN/GH_SECRETS_TOKEN}; paste it first (infra/README.md, First run)"
              exit 1
            fi
          done
          gh secret list --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY" --json name > /dev/null

      # The credential first, so that the bucket is created with it as its owner. The Civo CLI reads CIVO_TOKEN from the
      # environment but no region variable: without a config file it defaults to NYC1, so every call names the region
      # (found on the first staging run, 22 October 2026: a credential and a bucket in NYC1, and the LON1 endpoint
      # answered InvalidAccessKeyId). Values go from one command's output straight into another's standard input.
      - name: Create the state bucket and its credential, when missing
        if: inputs.rotate == 'none'
        run: |
          existing=$(gh secret list --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          if grep -qx STATE_ACCESS_KEY_ID <<< "$existing" && grep -qx STATE_SECRET_ACCESS_KEY <<< "$existing"; then
            echo "The state credential is already in the environment; the bucket is left as it is."
            exit 0
          fi
          # Region codes come back in lower case (nyc1), whatever case the flag takes.
          for region in $(civo region ls -o json | jq -r '.[].code | ascii_downcase'); do
            if [ "$region" != "$(tr '[:upper:]' '[:lower:]' <<< "$CIVO_REGION")" ] && civo objectstore show "$BUCKET" --region "$region" -o json > /dev/null 2>&1; then
              echo "::error::a store named $BUCKET exists in $region, not $CIVO_REGION; delete it and its credential in the Civo dashboard, then run again"
              exit 1
            fi
          done
          # The keys come from Civo's API, not the CLI: `civo objectstore credential secret -o json` prints an empty object
          # (its JSON branch appends nothing; v1.5.5), and only its plain text carries the secret. The list carries both keys.
          credentials() {
            curl --fail --silent --show-error --retry 3 -H "Authorization: Bearer $CIVO_TOKEN" \
              "https://api.civo.com/v2/objectstore/credentials?region=$CIVO_REGION&per_page=100" \
              | jq -r --arg name "$BUCKET" --arg field "$1" '(.items // .) | map(select(.name == $name)) | .[0][$field] // empty'
          }
          if [ -z "$(credentials access_key_id)" ]; then
            civo objectstore credential create "$BUCKET" --region "$CIVO_REGION" --wait > /dev/null
            echo "Created the credential $BUCKET in $CIVO_REGION."
          fi
          access_key=$(credentials access_key_id)
          secret_key=$(credentials secret_access_key_id)
          if [ -z "$access_key" ] || [ -z "$secret_key" ]; then
            echo "::error::the credential $BUCKET has no access key or no secret key yet; look at it in the Civo dashboard under Object stores > Credentials and run again"
            exit 1
          fi
          if ! civo objectstore show "$BUCKET" --region "$CIVO_REGION" -o json > /dev/null 2>&1; then
            civo objectstore create "$BUCKET" --size 500 --owner-name "$BUCKET" --region "$CIVO_REGION" --wait > /dev/null
            echo "Created the bucket $BUCKET in $CIVO_REGION (500 GB, the smallest Civo sells)."
          fi
          printf '%s' "$access_key" | gh secret set STATE_ACCESS_KEY_ID --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY"
          printf '%s' "$secret_key" | gh secret set STATE_SECRET_ACCESS_KEY --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY"
          echo "Wrote STATE_ACCESS_KEY_ID and STATE_SECRET_ACCESS_KEY to the environment $ENVIRONMENT."

      # The credential the environment holds, against the endpoint Terraform's backend uses (infra/civo/backend.tf), so a
      # wrong region or a stale pair fails here with the store's answer, not at the first tag's init. The runner's AWS CLI
      # speaks S3 to the store; it is signed with the region the backend signs with.
      - name: Check the state credential against the LON1 endpoint
        if: inputs.rotate == 'none'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          endpoint="https://objectstore.$(tr '[:upper:]' '[:lower:]' <<< "$CIVO_REGION").civo.com"
          # Path-style addressing, as the backend uses: the AWS CLI takes it from its config file only.
          mkdir -p ~/.aws && printf '[default]\ns3 =\n    addressing_style = path\n' > ~/.aws/config
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            # The pair was written seconds ago by this run: GitHub resolves secrets when the job starts, so a first run
            # checks on its next run, and a repeat run checks what it holds.
            echo "The pair was written by this run; run the workflow once more to check it against $endpoint."
            exit 0
          fi
          if ! aws s3api list-objects-v2 --bucket "$BUCKET" --max-keys 1 --endpoint-url "$endpoint" --region "$CIVO_REGION" > /dev/null; then
            echo "::error::the credential in the environment cannot list $BUCKET at $endpoint; delete STATE_ACCESS_KEY_ID and STATE_SECRET_ACCESS_KEY from the environment and run again, which writes a fresh pair (infra/README.md, Rotate)"
            exit 1
          fi
          echo "The state credential lists $BUCKET at $endpoint."

      # 48 random bytes for the two secrets docs/06 sizes that way.
      - name: Generate ID's secrets, when missing
        if: inputs.rotate == 'none'
        run: |
          existing=$(gh secret list --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          write() {
            if grep -qx "$1" <<< "$existing"; then
              echo "$1 exists; kept."
            else
              gh secret set "$1" --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY"
              echo "$1 written."
            fi
          }
          openssl rand -base64 48 | tr -d '\n' | write BETTER_AUTH_SECRET
          openssl rand -base64 48 | tr -d '\n' | write ROOT_ADMIN_SECRET

      # ROOT_ADMIN_SECRET is replaced outright. BETTER_AUTH_SECRET is never replaced here: it encrypts ID's stored
      # signing keys (apps/id/README.md, Application secret rotation).
      - name: Rotate ${{ inputs.rotate }}
        if: inputs.rotate != 'none'
        run: |
          case "$ROTATE" in
            ROOT_ADMIN_SECRET)
              openssl rand -base64 48 | tr -d '\n' | gh secret set ROOT_ADMIN_SECRET --env "$ENVIRONMENT" --repo "$GITHUB_REPOSITORY"
              ;;
          esac
          echo "$ROTATE replaced in the environment $ENVIRONMENT. The next tag applies it."

      - name: Summarise
        run: |
          if [ "$ROTATE" = none ]; then
            {
              echo "Environment \`$ENVIRONMENT\` is bootstrapped: the state bucket \`$BUCKET\` exists and the environment holds its credential and ID's secrets."
              echo "Next: push a tag \`$ENVIRONMENT/<name>\` on a commit of \`main\` (infra/README.md, First run)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "\`$ROTATE\` replaced in \`$ENVIRONMENT\`. Push a tag \`$ENVIRONMENT/<name>\` to apply it." >> "$GITHUB_STEP_SUMMARY"
          fi
