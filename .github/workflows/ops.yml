name: Ops

# Run one ops Job in an environment, through a Helm upgrade that keeps the images the release runs:
# - register: the MCP servers registered in Answerable ID again (a rotated client secret, a changed registration).
#   After a person holds platform:write, ID refuses the root secret, so the Job needs a staff token in the Secret
#   ops-staff-token first (infra/README.md, Register again).
# - make-admin: the last step of the first run, after the owner has signed in once: the member with that email
#   becomes the admin MCP's owner and a platform administrator, which locks the root secret.
# What this does and which secrets it needs: infra/pipeline/README.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to run the Job in
        required: true
        type: choice
        options:
          - staging
          - production
      command:
        description: The Job to run
        required: true
        type: choice
        options:
          - register
          - make-admin
      email:
        description: For make-admin, the email of the member who signed in
        required: false
        type: string

# The same lock as the deploys of that environment: two Helm upgrades at once make one of them fail.
concurrency:
  group: ${{ inputs.environment == 'production' && 'deploy-production' || 'deploy-staging' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  run:
    name: Run ${{ inputs.command }} in ${{ inputs.environment }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - uses: ./.github/actions/setup-tools
        with:
          tools: helm kubectl

      - name: Run the Job
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          COMMAND: ${{ inputs.command }}
          TARGET: ${{ inputs.environment }}
          EMAIL: ${{ inputs.email }}
        run: |
          if [ "$COMMAND" = make-admin ]; then
            if [ -z "$EMAIL" ]; then
              echo "::error::make-admin needs the email of the member who signed in"
              exit 1
            fi
            bun infra/pipeline/src/cli.ts run-job make-admin --environment "$TARGET" --email "$EMAIL"
          else
            bun infra/pipeline/src/cli.ts run-job "$COMMAND" --environment "$TARGET"
          fi

  smoke:
    name: Smoke test ${{ inputs.environment }}
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.1

      - name: Smoke test
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          status=0
          bun infra/pipeline/src/cli.ts smoke --environment "$TARGET" --wait 300 | tee smoke.txt || status=$?
          { echo '```text'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
