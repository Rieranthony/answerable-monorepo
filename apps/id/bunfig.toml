[test]
root = "src"
preload = ["./src/__tests__/preload.ts"]
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { lines = 1, functions = 1 }
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# @answerable/auth and @answerable/config are measured by their own suites; ID only imports the verifier and the definition.
coveragePathIgnorePatterns = ["src/**/*.test.ts", "src/__tests__/**", "src/server.ts", "../../packages/auth/**", "../../packages/config/**"]
